name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run router tests
        working-directory: router
        run: mvn test

      - name: Run delayer tests
        working-directory: delayer
        run: mvn test

  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make CI scripts executable
        run: |
          chmod +x scripts-bash/ci-start-infra.sh
          chmod +x scripts-bash/ci-start-kafka.sh
          chmod +x scripts-bash/ci-start-redis.sh
          chmod +x scripts-bash/ci-start-minimal.sh
          chmod +x scripts-bash/ci-start-ldap.sh

      - name: Start test infrastructure
        run: ./scripts-bash/ci-start-infra.sh

      - name: Start notification services
        run: ./scripts-bash/ci-start-minimal.sh

      - name: Check notification services
        if: always()
        run: |
          echo "========== RUNNING JAVA PROCESSES =========="
          ps aux | grep java || true

          echo ""
          echo "========== LISTENING PORTS =========="
          ss -lntp || true

          echo ""
          echo "========== CI LOG FILES =========="
          ls -lah logs/ci || true

      - name: Run E2E tests
        working-directory: e2e-tests
        run: mvn test

      - name: Show E2E service logs
        if: always()
        run: |
          echo "========================================"
          echo "========== SMTP PROXY =========="
          echo "========================================"
          cat logs/ci/smtp-proxy.log || true

          echo ""
          echo "========================================"
          echo "========== PRODUCER API =========="
          echo "========================================"
          cat logs/ci/producer-api.log || true

          echo ""
          echo "========================================"
          echo "========== CONSUMER MAIL =========="
          echo "========================================"
          cat logs/ci/consumer-mail.log || true

          echo ""
          echo "========================================"
          echo "========== ROUTER =========="
          echo "========================================"
          cat logs/ci/router.log || true

          echo ""
          echo "========================================"
          echo "========== EXPANDER =========="
          echo "========================================"
          cat logs/ci/expander.log || true

          echo ""
          echo "========================================"
          echo "========== DELAYER =========="
          echo "========================================"
          cat logs/ci/delayer.log || true

          echo ""
          echo "========================================"
          echo "========== CONSUMER WEB =========="
          echo "========================================"
          cat logs/ci/consumer-web.log || true

      - name: Show E2E test reports
        if: always()
        run: |
          echo "========================================"
          echo "========== SUREFIRE REPORTS =========="
          echo "========================================"

          find e2e-tests/target/surefire-reports \
            -type f \
            -maxdepth 1 \
            -print \
            -exec sh -c 'echo "----- $1 -----"; cat "$1"' _ {} \; \
            || true