name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run router tests
        working-directory: router
        run: mvn test

      - name: Run delayer tests
        working-directory: delayer
        run: mvn test

  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make CI scripts executable
        run: |
          chmod +x scripts-bash/ci-start-infra.sh
          chmod +x scripts-bash/ci-start-kafka.sh
          chmod +x scripts-bash/ci-start-redis.sh
          chmod +x scripts-bash/ci-start-minimal.sh
          chmod +x scripts-bash/ci-start-ldap.sh

      - name: Start test infrastructure
        run: ./scripts-bash/ci-start-infra.sh

      - name: Start notification services
        run: ./scripts-bash/ci-start-minimal.sh

      - name: Run E2E tests
        working-directory: e2e-tests
        run: mvn test

      - name: Show E2E service logs
        if: always()
        run: |
          echo "========== SMTP PROXY =========="
          cat logs/ci/smtp-proxy.log

          echo "========== CONSUMER MAIL =========="
          cat logs/ci/consumer-mail.log

          echo "========== ROUTER =========="
          cat logs/ci/router.log

          echo "========== EXPANDER =========="
          cat logs/ci/expander.log

          echo "========== DELAYER =========="
          cat logs/ci/delayer.log

          echo "========== CONSUMER WEB =========="
          cat logs/ci/consumer-web.log