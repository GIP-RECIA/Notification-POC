proxy:
  port: 1026

routing:
  rules:
    - header: From
      regex: ".*Nextcloud.*"
      processor: NextcloudProcessor
      service: "NEXTCLOUD"
      api-key: "API_KEY"

notification-api:
  url: "http://localhost:8179/event/emit"
  titre-nextcloud: "Un fichier a été partagé avec vous."

spring:
  application:
    smtp-proxy
  mail:
    host: localhost
    port: 1025
    #username: proxy
    #password: secure
    #properties:
      #mail:
        #smtp:
          #auth: true
          #starttls:
            #enable: true

smtp:
  require-auth: true
  require-tls: true
  keystore-path: /home/user/Notification-POC/smtp-proxy/smtp-proxy.p12
  keystore-password: "password"
  key-password: "password"
  credentials:
    user-1: "password1"
    user-2: "password2"